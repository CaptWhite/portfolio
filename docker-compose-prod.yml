services:
  portfolio:
    image: captwhite/portfolio:latest
    container_name: portfolio
    restart: always
    env_file:
      - ./.env

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio-http.entrypoints=web"
      - "traefik.http.routers.portfolio-http.rule=Host(`captwhite.com`)"
      - "traefik.http.routers.portfolio-http.middlewares=redirect-to-https@docker"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      #
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.rule=Host(`captwhite.com`)"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
    networks:
      - webnet-astro

networks:
  webnet-astro:
    external: true

